name: DevSecOps CI/CD Security Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      fail_on_findings:
        description: "Enforce strict pipeline blocking on security gate failures"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------
  # Gate 1: Static Application Security Testing (SAST)
  # -------------------------------------------------------------
  sast-semgrep:
    name: "Gate 1: SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Semgrep Security Rulesets
        run: |
          semgrep scan \
            --config "p/javascript" \
            --config "p/owasp-top-ten" \
            --error \
            --sarif \
            --output semgrep-results.sarif \
            app/ || EXIT_CODE=$?

          echo "Semgrep scan completed with exit code: ${EXIT_CODE:-0}"
          if [ "${{ github.event.inputs.fail_on_findings }}" != "false" ] && [ "${EXIT_CODE:-0}" -ne 0 ]; then
            echo "::error::Gate 1 FAILED: Semgrep detected High/Critical security violations."
            exit 1
          fi

      - name: Upload SAST SARIF Results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif

  # -------------------------------------------------------------
  # Gate 2: Software Composition Analysis (SCA)
  # -------------------------------------------------------------
  sca-dependency-audit:
    name: "Gate 2: SCA (npm audit)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 14
          cache: "npm"

      - name: Run Dependency Audit (High/Critical Check)
        run: |
          echo "Executing Software Composition Analysis (SCA)..."
          npm audit --audit-level=high --json > npm-audit-report.json || AUDIT_EXIT=$?
          echo "npm audit finished with exit code: ${AUDIT_EXIT:-0}"

          if [ "${{ github.event.inputs.fail_on_findings }}" != "false" ] && [ "${AUDIT_EXIT:-0}" -ne 0 ]; then
            echo "::warning::Gate 2: High/Critical dependency vulnerabilities found."
            # Toggle enforcement based on pipeline strictness
            if [ "${{ github.event.inputs.fail_on_findings }}" == "true" ]; then
              echo "::error::Gate 2 FAILED: SCA threshold exceeded."
              exit 1
            fi
          fi

      - name: Upload SCA Audit Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  # -------------------------------------------------------------
  # Gate 3: Secret Detection & Credential Scanning
  # -------------------------------------------------------------
  secret-scan-gitleaks:
    name: "Gate 3: Secrets (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_SUMMARY: true

  # -------------------------------------------------------------
  # Gate 4: Container Security & Image Vulnerability Scanning
  # -------------------------------------------------------------
  container-security-trivy:
    name: "Gate 4: Container Security (Trivy)"
    runs-on: ubuntu-latest
    needs: [sast-semgrep, sca-dependency-audit, secret-scan-gitleaks]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container Image
        run: |
          docker build \
            --tag nodegoat-web:${{ github.sha }} \
            --file Dockerfile .

      - name: Run Aquasec Trivy Image Scanner (Blocking Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "nodegoat-web:${{ github.sha }}"
          format: "table"
          exit-code: "1" # STRICT BLOCKING: Fails build on High/Critical CVEs
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Run Baseline Trivy SARIF Report Generation
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: "nodegoat-web:${{ github.sha }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"

      - name: Upload Container Scan SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # -------------------------------------------------------------
  # Deployment Stage: Runtime Secret Injection
  # -------------------------------------------------------------
  deploy-verification:
    name: "Deploy & Runtime Secret Injection"
    runs-on: ubuntu-latest
    needs: [container-security-trivy]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Runtime Secret Injection
        env:
          NODE_ENV: production
          PORT: 4000
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          echo "Verifying runtime secret injection into deployment environment..."
          if [ -z "$SESSION_SECRET" ]; then
            echo "::warning::SESSION_SECRET secret not set in GitHub repository secrets. Using runner default."
          else
            echo "SESSION_SECRET successfully supplied via GitHub Encrypted Secrets (masked: ***)."
          fi
          echo "Target deployment environment configured successfully."
